name: Godot validation

on:
  push:
    branches: [cxm, xxy, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Download the pinned official engine
        shell: bash
        run: |
          curl --fail --location --retry 3 "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
      - name: Validate project
        run: python3 tools/verify_project.py --godot /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-logs
          path: .validation/*.log
